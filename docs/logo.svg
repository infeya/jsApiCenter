<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00474f" />
      <stop offset="45%" stop-color="#006D75" />
      <stop offset="100%" stop-color="#13c2c2" />
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08979c" />
      <stop offset="100%" stop-color="#36cfc9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#006D75" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Hexagon Shield Badge -->
  <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="url(#apiGrad)" filter="url(#shadow)" rx="6" />
  
  <!-- Inner Circuit Network Lines -->
  <path d="M50 22 L50 42 M50 58 L50 78 M30 35 L42 45 M70 35 L58 45 M30 65 L42 55 M70 65 L58 55" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
  
  <!-- Center Core Hub Node -->
  <circle cx="50" cy="50" r="11" fill="#ffffff" />
  <circle cx="50" cy="50" r="7" fill="url(#apiGrad)" />
  
  <!-- Outer Connection Nodes -->
  <circle cx="50" cy="22" r="5" fill="#13c2c2" stroke="#ffffff" stroke-width="2" />
  <circle cx="50" cy="78" r="5" fill="#13c2c2" stroke="#ffffff" stroke-width="2" />
  <circle cx="30" cy="35" r="5" fill="#36cfc9" stroke="#ffffff" stroke-width="2" />
  <circle cx="70" cy="35" r="5" fill="#36cfc9" stroke="#ffffff" stroke-width="2" />
  <circle cx="30" cy="65" r="5" fill="#36cfc9" stroke="#ffffff" stroke-width="2" />
  <circle cx="70" cy="65" r="5" fill="#36cfc9" stroke="#ffffff" stroke-width="2" />
</svg>
